name: Archive EBiZ team entries to PRIVATE Google Drive
on:
  schedule:
    - cron: "17 * * * *"   # hourly, after activation; schedules may be delayed by GitHub
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebiz-team-drive-archive
  cancel-in-progress: false
jobs:
  archive:
    # Explicit owner-controlled switch. Secrets must be set; default is OFF.
    if: ${{ vars.EBIZ_DRIVE_ARCHIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal archive dependencies
        run: python -m pip install --disable-pip-version-check requests google-api-python-client google-auth google-auth-httplib2
      - name: Verify private storage in Google Drive by checksums
        env:
          SUPABASE_URL: ${{ secrets.EBIZ_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EBIZ_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EBIZ_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.EBIZ_GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.EBIZ_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_VIDEO_FOLDER_ID: ${{ vars.EBIZ_GDRIVE_VIDEO_FOLDER_ID }}
          GDRIVE_CONSENT_FOLDER_ID: ${{ vars.EBIZ_GDRIVE_CONSENT_FOLDER_ID }}
          GDRIVE_ADMIN_FOLDER_ID: ${{ vars.EBIZ_GDRIVE_ADMIN_FOLDER_ID }}
        run: python scripts/archive_team_entries_to_drive.py
